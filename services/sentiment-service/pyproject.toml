[project]
name = "sentiment-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.9.1",
    "transformers[torch]==4.51.0",
    "fastapi[standard]==0.115.14",
    "pysbd>=0.3.4",
    "openai>=1.0.0",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"
name = "pytorch-cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
