[project]
name = "clarus-evaluation"
version = "0.1.0"
description = "Evaluation framework for Clarus Bias Checker (LLM, rule-based, and ML services)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "openai>=1.0",
    "rich>=13.0",
    "google-genai>=1.0",
    "torch>=2.0",
    "transformers>=4.30",
    "sentence-transformers>=2.2",
    "scikit-learn>=1.3",
    "pandas>=2.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]
